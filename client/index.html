<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusBoard</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- login screen -->
    <div id="login-screen" class="screen active">
        <canvas id="particle-canvas"></canvas>
        <div class="login-container">
            <div class="login-logo">
                <div class="logo-icon">N</div>
                <h1 class="logo-text">Nexus<span>Board</span></h1>
                <p class="logo-sub">command center</p>
            </div>
            <form id="login-form" autocomplete="off">
                <div class="input-group">
                    <input type="text" id="login-user" required autocomplete="username">
                    <label for="login-user" data-i18n="login.username">Имя пользователя</label>
                    <div class="input-line"></div>
                </div>
                <div class="input-group">
                    <input type="password" id="login-pass" required autocomplete="current-password">
                    <label for="login-pass" data-i18n="login.password">Пароль</label>
                    <div class="input-line"></div>
                </div>
                <button type="submit" class="btn-login" data-i18n="login.submit">
                    <span>Войти</span>
                    <div class="btn-pulse"></div>
                </button>
                <p id="login-error" class="login-error"></p>
            </form>
            <div class="login-lang">
                <button data-lang="ru" class="lang-btn active">RU</button>
                <button data-lang="en" class="lang-btn">EN</button>
            </div>
        </div>
    </div>

    <!-- setup screen (first run) -->
    <div id="setup-screen" class="screen">
        <div class="login-container">
            <div class="login-logo">
                <div class="logo-icon">N</div>
                <h1 class="logo-text">Nexus<span>Board</span></h1>
                <p class="logo-sub" data-i18n="setup.title">Первоначальная настройка</p>
            </div>
            <form id="setup-form" autocomplete="off">
                <div class="input-group">
                    <input type="text" id="setup-user" required>
                    <label for="setup-user" data-i18n="setup.username">Логин администратора</label>
                    <div class="input-line"></div>
                </div>
                <div class="input-group">
                    <input type="text" id="setup-display" required>
                    <label for="setup-display" data-i18n="setup.display">Отображаемое имя</label>
                    <div class="input-line"></div>
                </div>
                <div class="input-group">
                    <input type="password" id="setup-pass" required minlength="8">
                    <label for="setup-pass" data-i18n="setup.password">Пароль (мин. 8 символов)</label>
                    <div class="input-line"></div>
                </div>
                <button type="submit" class="btn-login" data-i18n="setup.submit">
                    <span>Создать аккаунт</span>
                    <div class="btn-pulse"></div>
                </button>
                <p id="setup-error" class="login-error"></p>
            </form>
        </div>
    </div>

    <!-- dashboard -->
    <div id="dashboard-screen" class="screen">
        <header class="topbar">
            <div class="topbar-left">
                <div class="logo-small">N</div>
                <span class="topbar-title">NexusBoard</span>
            </div>
            <div class="topbar-center">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <input type="text" id="search-input" data-i18n-placeholder="dashboard.search" placeholder="Поиск сервисов...">
                </div>
            </div>
            <div class="topbar-right">
                <button class="topbar-btn" id="btn-lang" title="Language">
                    <span id="current-lang">RU</span>
                </button>
                <button class="topbar-btn" id="btn-notifications" title="Notifications">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span class="notif-badge" id="notif-count" style="display:none">0</span>
                </button>
                <div class="user-menu" id="user-menu">
                    <div class="user-avatar" id="user-avatar">?</div>
                    <div class="user-dropdown" id="user-dropdown">
                        <div class="user-info">
                            <strong id="user-display"></strong>
                            <small id="user-role"></small>
                        </div>
                        <hr>
                        <button id="btn-admin" class="dropdown-item" style="display:none" data-i18n="menu.admin">Админ-панель</button>
                        <button id="btn-logout" class="dropdown-item" data-i18n="menu.logout">Выйти</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- system widgets -->
        <section class="system-bar" id="system-bar">
            <div class="sys-widget" id="widget-cpu">
                <svg class="ring" viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.9"/><circle class="ring-fill" cx="18" cy="18" r="15.9" stroke-dasharray="0 100"/></svg>
                <div class="sys-info"><span class="sys-val" id="cpu-val">--</span><span class="sys-label">CPU</span></div>
            </div>
            <div class="sys-widget" id="widget-ram">
                <svg class="ring" viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.9"/><circle class="ring-fill" cx="18" cy="18" r="15.9" stroke-dasharray="0 100"/></svg>
                <div class="sys-info"><span class="sys-val" id="ram-val">--</span><span class="sys-label">RAM</span></div>
            </div>
            <div class="sys-widget" id="widget-disk">
                <svg class="ring" viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.9"/><circle class="ring-fill" cx="18" cy="18" r="15.9" stroke-dasharray="0 100"/></svg>
                <div class="sys-info"><span class="sys-val" id="disk-val">--</span><span class="sys-label" data-i18n="widgets.disk">Диск</span></div>
            </div>
            <div class="sys-widget sys-text-widget" id="widget-uptime">
                <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="12 6 12 12 16 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <div class="sys-info"><span class="sys-val" id="uptime-val">--</span><span class="sys-label" data-i18n="widgets.uptime">Аптайм</span></div>
            </div>
        </section>

        <!-- services grid -->
        <main class="services-wrap" id="services-wrap">
            <p class="loading-text" data-i18n="dashboard.loading">Загрузка...</p>
        </main>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/widgets.js"></script>
    <script src="js/services.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
