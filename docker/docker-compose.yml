services:
  nexusboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nexusboard
    restart: unless-stopped
    ports:
      - "3050:3000"
    volumes:
      - nexusboard_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PORT=3000
    env_file:
      - ../.env

volumes:
  nexusboard_data:
